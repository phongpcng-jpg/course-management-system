spring.application.name=course-management-system

# Datasource
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Multipart file upload settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

#logging
logging.file.name=logs/runtime_project.log
logging.file.path=logs
logging.level.root=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %level - %logger - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %level - %logger - %msg%n
logging.pattern.level=%5p
logging.logback.rollingpolicy.max-file-size=10MB
# --> 10MB --> file .gz
logging.logback.rollingpolicy.max-history=7
logging.structured.format.console=ecs
logging.structured.format.file=logstash

# Server port configuration
server.port=${SERVER_PORT}

# Jwt configuration
jwt.secret-key=${JWT_SECRET_KEY}
jwt.expiration=7200000
